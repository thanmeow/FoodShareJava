spring.application.name=demo

# MySQL - change the username/password to match your MySQL install
# (or set the DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/foodshare?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:home}
spring.datasource.password=${DB_PASSWORD:home}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Send the error message to the browser so the pages can show it
server.error.include-message=always

# JWT - use your own long random secret in production (at least 32 characters)
jwt.secret=${JWT_SECRET:foodshare-dev-secret-change-this-in-production-123}
jwt.expiry-hours=24

# Admin account, created on startup if it does not exist yet
admin.email=${ADMIN_EMAIL:admin@foodshare.com}
admin.password=${ADMIN_PASSWORD:admin123}
